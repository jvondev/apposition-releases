name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: win
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild Native Dependencies for Electron
        run: npx electron-rebuild

      - name: Build App Packages
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npx electron-builder --linux -c electron-builder.yml -c.npmRebuild=false --publish never
          fi
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npx electron-builder --mac --universal -c electron-builder.yml -c.npmRebuild=false --publish never
          fi
          if [ "${{ matrix.platform }}" = "win" ]; then
            npx electron-builder --win --x64 --arm64 -c electron-builder.yml -c.npmRebuild=false --publish never
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}