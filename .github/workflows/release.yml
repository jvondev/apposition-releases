name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET SDK (Windows Velopack)
        if: matrix.platform == 'win'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild Native Dependencies for Electron
        run: npx electron-rebuild

      - name: Build App Packages
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npx electron-builder --linux --x64 -c electron-builder.yml -c.npmRebuild=false --publish never
          fi
          if [ "${{ matrix.platform }}" = "mac" ]; then
            sudo mdutil -a -i off || true
            npx electron-builder --mac --arm64 --x64 -c electron-builder.yml -c.npmRebuild=false --publish never || (sleep 10 && npx electron-builder --mac --arm64 --x64 -c electron-builder.yml -c.npmRebuild=false --publish never)
          fi
          if [ "${{ matrix.platform }}" = "win" ]; then
            # 1. Build unpacked electron distribution
            npx electron-builder --win --dir -c electron-builder.yml -c.npmRebuild=false
            
            # 2. Install Velopack CLI
            dotnet tool install -g vpk
            
            # 3. Format clean semver version string (e.g. v1.2.3 -> 1.2.3)
            VERSION_RAW="${{ github.ref_name }}"
            VERSION="${VERSION_RAW#v}"
            
            # 4. Pull previous release metadata for binary delta generation
            vpk download github --repoUrl https://github.com/jvondev/apposition-releases --outputDir dist/releases || true
            
            # 5. Pack with Velopack
            MAIN_EXE=$(find dist/win-unpacked -maxdepth 1 -name "*.exe" ! -name "elevate.exe" | head -n 1 | xargs -n 1 basename)
            PACK_ID="Apposition"
            if [[ "$VERSION" == *"-"* ]]; then
              PACK_ID="AppositionCanary"
            fi
            vpk pack --packId "$PACK_ID" --packVersion "$VERSION" --packDir dist/win-unpacked --mainExe "$MAIN_EXE" --icon assets/icon.ico --outputDir dist/releases
            
            # 6. Upload Velopack release assets & binary deltas to GitHub (merge into tag release)
            vpk upload github --repoUrl https://github.com/jvondev/apposition-releases --token "${{ secrets.GITHUB_TOKEN }}" --tag "${{ github.ref_name }}" --merge --publish --outputDir dist/releases
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Mac & Linux)
        if: matrix.platform != 'win'
        run: |
          shopt -s nullglob
          gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --prerelease || true
          ASSETS=(dist/*.dmg dist/*.AppImage dist/*.deb dist/*.yml dist/*.blockmap)
          if [ ${#ASSETS[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" "${ASSETS[@]}" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    name: Submit to WinGet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Submit to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: jvondev.apposition
          installers-regex: 'Apposition-win-Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: jvondev
