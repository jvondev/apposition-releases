name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild Native Dependencies for Electron
        run: npx electron-rebuild

      - name: Build App Packages
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npx electron-builder --linux -c electron-builder.yml -c.npmRebuild=false --publish never
          fi
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npx electron-builder --mac --universal -c electron-builder.yml -c.npmRebuild=false --publish never
          fi
          if [ "${{ matrix.platform }}" = "win" ]; then
            npx electron-builder --win --x64 --arm64 -c electron-builder.yml -c.npmRebuild=false --publish never
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-package-managers:
    name: Auto-Update Homebrew & WinGet
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract Tag Version
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Compute Asset Hashes
        id: hashes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="${{ github.repository }}"
          sleep 10
          DMG_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Apposition.App-${VERSION}-universal.dmg"
          curl -sL "$DMG_URL" -o app.dmg
          DMG_SHA=$(sha256sum app.dmg | awk '{print $1}')
          echo "DMG_SHA=${DMG_SHA}" >> "$GITHUB_OUTPUT"
          echo "Universal DMG SHA256: ${DMG_SHA}"

      - name: Update Homebrew Cask
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DMG_SHA="${{ steps.hashes.outputs.DMG_SHA }}"
          REPO="${{ github.repository }}"
          
          cat << EOF > Casks/apposition.rb
cask "apposition" do
  version "${VERSION}"
  sha256 "${DMG_SHA}"

  url "https://github.com/${REPO}/releases/download/v#{version}/Apposition.App-#{version}-universal.dmg"
  name "Apposition"
  desc "A smart digital workspace to organize web apps, accounts, and tasks in one place"
  homepage "https://github.com/${REPO}"

  auto_updates true

  app "Apposition.app"

  zap trash: [
    "~/Library/Application Support/Apposition",
    "~/Library/Logs/Apposition",
    "~/Library/Preferences/com.jvondev.apposition.app.plist",
    "~/Library/Saved Application State/com.jvondev.apposition.app.savedState",
  ]
end
EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/apposition.rb
          git commit -m "chore(cask): auto-update apposition cask to v${VERSION}" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"

      - name: Publish to WinGet Community Repository
        uses: vedantmgoyal2009/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: jvondev.apposition
          version: ${{ steps.version.outputs.VERSION }}
          installer-url: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/Apposition.App.Setup.${{ steps.version.outputs.VERSION }}.exe
          installer-type: nullsoft
          token: ${{ secrets.GITHUB_TOKEN }}
