appId: com.jvondev.apposition.app
productName: Apposition
compression: maximum
asar: true
asarUnpack:
  - "**/*.node"
directories:
  buildResources: assets
  output: dist
files:
  - out
  - assets
  - "!**/.vscode"
  - "!**/.github"
npmArgs:
  - "--legacy-peer-deps"
publish:
  - provider: github
    owner: jvondev
    repo: apposition-releases
    private: false
    releaseType: release

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: assets/icon.png
  identity: null
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  minimumSystemVersion: "11.0.0"

dmg:
  sign: false
  writeUpdateInfo: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Apposition"
  include: build/installer.nsh
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  differentialPackage: true

linux:
  category: Utility;Network;WebBrowser;
  maintainer: jvondev <jvondev@users.noreply.github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icon.png
  desktop:
    StartupWMClass: apposition
    MimeType: x-scheme-handler/apposition;

deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - libnss3
    - libasound2
    - libsecret-1-0
