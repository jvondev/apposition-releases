appId: com.jvondev.apposition.app
productName: Apposition App
directories:
  buildResources: assets
  output: dist
files:
  - out
  - assets
  - "!**/.vscode"
  - "!**/.github"
npmArgs:
  - "--legacy-peer-deps"
publish:
  - provider: github
    # Replace this with your public repository info
    owner: jvondev
    repo: apposition-releases
    private: false
    releaseType: release
mac:
  target:
    - dmg
    - zip
  icon: assets/icon.png
win:
  target:
    - nsis
  icon: assets/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Apposition"
  include: build/installer.nsh
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

linux:
  target:
    - AppImage
  icon: assets/icon.png
